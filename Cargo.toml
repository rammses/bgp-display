[package]
name        = "bgp-link-manager"
version     = "0.1.0"
edition     = "2021"
description = "TUI-based BGP configuration and state manager (Cisco IOS/IOS-XE; Juniper & FortiGate planned)"

[[bin]]
name = "bgp-link-manager"
path = "src/main.rs"

[dependencies]
ratatui   = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio     = { version = "1",    features = ["full"] }
serde     = { version = "1",    features = ["derive"] }
toml      = "0.8"
anyhow    = "1"
chrono    = { version = "0.4",  features = ["serde"] }
uuid      = { version = "1",    features = ["v4", "serde"] }
regex     = "1"
dirs      = "5"
futures   = "0.3"

# SQLite
rusqlite  = { version = "0.31", features = ["bundled"] }

# Encryption (AES-256-GCM + Argon2 key derivation)
aes-gcm   = "0.10"
argon2    = "0.5"
rand      = "0.8"
base64    = "0.22"

# Structured logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender   = "0.2"

[features]
default   = []
