name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15
            name: bgp-link-manager-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-15
            name: bgp-link-manager-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: bgp-link-manager-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: bgp-link-manager-aarch64-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: bgp-link-manager-x86_64-windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz bgp-link-manager
          cd ../../..

      - name: Package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/bgp-link-manager.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS and Linux tarballs
        run: |
          BASE="https://github.com/rammses/bgp-display/releases/download/${GITHUB_REF_NAME}"
          curl -sLO "${BASE}/bgp-link-manager-aarch64-apple-darwin.tar.gz"
          curl -sLO "${BASE}/bgp-link-manager-x86_64-apple-darwin.tar.gz"
          curl -sLO "${BASE}/bgp-link-manager-aarch64-linux-gnu.tar.gz"
          curl -sLO "${BASE}/bgp-link-manager-x86_64-linux-gnu.tar.gz"

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "macos_arm=$(sha256sum bgp-link-manager-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "macos_intel=$(sha256sum bgp-link-manager-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm=$(sha256sum bgp-link-manager-aarch64-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_intel=$(sha256sum bgp-link-manager-x86_64-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          cat > bgp-link-manager.rb << FORMULA
          class BgpLinkManager < Formula
            desc "TUI-based BGP configuration and state manager for multi-vendor routers"
            homepage "https://github.com/rammses/bgp-display"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/rammses/bgp-display/releases/download/${TAG}/bgp-link-manager-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.macos_arm }}"
              end
              on_intel do
                url "https://github.com/rammses/bgp-display/releases/download/${TAG}/bgp-link-manager-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.macos_intel }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/rammses/bgp-display/releases/download/${TAG}/bgp-link-manager-aarch64-linux-gnu.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm }}"
              end
              on_intel do
                url "https://github.com/rammses/bgp-display/releases/download/${TAG}/bgp-link-manager-x86_64-linux-gnu.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_intel }}"
              end
            end

            def install
              bin.install "bgp-link-manager"
            end

            test do
              assert_predicate bin/"bgp-link-manager", :executable?
            end
          end
          FORMULA
          sed -i 's/^          //' bgp-link-manager.rb

      - name: Push formula to homebrew-tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:rammses/homebrew-tap.git tap
          cp bgp-link-manager.rb tap/Formula/bgp-link-manager.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bgp-link-manager.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "update bgp-link-manager to ${{ steps.version.outputs.version }}"
          git push
